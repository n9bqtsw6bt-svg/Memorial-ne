name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build AnesCME
        run: |
          npm ci
          npm run build
        working-directory: anes-cme

      - name: Build ASA Triage
        run: |
          npm ci
          npm run build
        working-directory: asa-triage

      - name: Combine builds
        run: |
          mkdir -p combined
          cp -r anes-cme/dist/. combined/
          mkdir -p combined/asa-triage
          cp -r asa-triage/dist/. combined/asa-triage/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
